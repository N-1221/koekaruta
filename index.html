<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>こえかるた(みんなバージョン)</title>
<style>
:root{--paper:#F1E9D8;--deep:#E7DCC3;--ink:#2B2621;--seal:#B0432F;--moss:#5C7A5A}
@media(prefers-color-scheme:dark){:root{--paper:#221E19;--deep:#2B2621;--ink:#EFE6D6;--seal:#D9694F;--moss:#7FA57C}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Zen Maru Gothic",sans-serif;display:flex;justify-content:center}
.wrap{width:100%;max-width:640px;padding:24px 18px 48px}
h1{font-family:"Hiragino Mincho ProN","Shippori Mincho",serif;text-align:center;margin:0 0 4px;letter-spacing:.08em}
h1 span{color:var(--seal)}
.sub{text-align:center;font-size:13px;opacity:.6;margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.card{background:var(--deep);border:2px solid color-mix(in srgb,var(--ink) 18%,transparent);border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px}
.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.card input{width:100%;text-align:center;font:inherit;padding:6px;border-radius:8px;border:1px solid color-mix(in srgb,var(--ink) 25%,transparent);background:var(--paper);color:var(--ink)}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--ink);background:transparent;color:var(--ink);padding:8px 14px;border-radius:999px;font-size:13px}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.rec{background:var(--seal);color:#fff;border-color:var(--seal)}
.btn.main{background:var(--seal);color:#fff;border-color:var(--seal);font-size:16px;padding:12px 30px}
.sel{font:inherit;width:100%;padding:6px;border-radius:8px;background:var(--paper);color:var(--ink);border:1px solid color-mix(in srgb,var(--ink) 25%,transparent)}
.btn:disabled{opacity:.4;cursor:default}
.status{font-size:12px;opacity:.7;min-height:16px}
.center{text-align:center;margin-top:20px}
.note{font-size:12px;opacity:.6;line-height:1.7;margin-top:18px}
.play{width:84px;height:84px;border-radius:50%;border:none;background:var(--seal);color:#fff;font-size:34px;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.stage{background:var(--deep);border-radius:18px;padding:22px;text-align:center;margin-bottom:18px}
.gcard{cursor:pointer}.gcard:hover{transform:translateY(-2px)}
.gcard.correct{border-color:var(--moss);background:color-mix(in srgb,var(--moss) 20%,var(--deep))}
.gcard.wrong{border-color:var(--seal);background:color-mix(in srgb,var(--seal) 18%,var(--deep))}
.fb{text-align:center;min-height:28px;margin-top:16px;font-size:16px}
.score{display:flex;justify-content:center;gap:24px;margin-bottom:14px;font-size:14px}
.hidden{display:none}
</style></head><body><div class="wrap">
<h1>こえ<span>かるた</span></h1>
<p class="sub">きこえた こえは、だれのこえ?</p>

<section id="setup">
  <div class="grid" id="setupGrid"></div>
  <p class="note">① 名前を入力 → ② 「▶ きく」で録音ファイルを聴いて、写真の人と合うものを選ぶ → ③ 「あそぶ」。<br>声の割り当ては人ごとに変えられます。「録音しなおす」でマイクから録り直すこともできます(ページを閉じると消えます)。</p>
  <div class="center"><button class="btn main" id="startBtn">あそぶ</button></div>
</section>

<section id="game" class="hidden">
  <div class="score"><span>せいかい <b id="sc">0</b></span><span>もんすう <b id="st">0</b></span></div>
  <div class="stage"><p>ボタンをおして こえをきいてね</p><button class="play" id="playBtn">▶</button></div>
  <div class="grid" id="gameGrid"></div>
  <p class="fb" id="fb"></p>
  <div class="center"><button class="btn hidden" id="nextBtn">つぎへ →</button></div>
</section>
</div>

const $=id=>document.getElementById(id);
const synth=window.speechSynthesis;
let curAudio=null;

function playVoice(p){
  if(curAudio){curAudio.pause();curAudio=null}
  if(synth)synth.cancel();
  if(p.url){curAudio=new Audio(p.url);curAudio.play().catch(()=>{});return}
  const u=new SpeechSynthesisUtterance('わたしはだれでしょう');
  u.lang='ja-JP';u.pitch=p.pitch;u.rate=p.rate;synth&&synth.speak(u);
}

    const c=document.createElement('div');c.className='card';
    c.innerHTML=`<img src="${p.img}" alt=""><input value="${p.name}" aria-label="名前">
      <select class="sel" aria-label="こえ">${clips.map((_,k)=>`<option value="${k}" ${p.clip===k?'selected':''}>録音ファイル${k+1}</option>`).join('')}</select><button class="btn rec">● 録音しなおす</button><button class="btn" ${p.url?'':'disabled'}>▶ きく</button><span class="status">${p.url?'こえあり':'こえなし(合成音声)'}</span>`;
    const [inp,recB,playB]=[c.querySelector('input'),c.querySelectorAll('button')[0],c.querySelectorAll('button')[1]];
    c.querySelector('.sel').onchange=e=>{p.clip=+e.target.value;p.url=clips[p.clip];renderSetup();};
    const st=c.querySelector('.status');
    inp.oninput=()=>p.name=inp.value||('さん'+(i+1));
    playB.onclick=()=>playVoice(p);
    recB.onclick=async()=>{
      try{
        const s=await navigator.mediaDevices.getUserMedia({audio:true});
        const mr=new MediaRecorder(s),chunks=[];
        mr.ondataavailable=e=>chunks.push(e.data);
        mr.onstop=()=>{s.getTracks().forEach(t=>t.stop());
          p.url=URL.createObjectURL(new Blob(chunks,{type:mr.mimeType}));
          renderSetup();};
        mr.start();recB.disabled=true;let n=5;
        const t=setInterval(()=>{st.textContent=`録音中… ${n}`;if(n--<=0){clearInterval(t);mr.stop()}},1000);
        st.textContent='録音中… 5';
      }catch(e){st.textContent='マイクが使えません(許可を確認)'}
    };
    g.appendChild(c);
  });
}

// --- game ---
let target=null,answered=false,sc=0,st=0;
function newRound(){
  answered=false;$('fb').textContent='';$('nextBtn').classList.add('hidden');
  const opts=[...people].sort(()=>Math.random()-.5);
  target=opts[Math.floor(Math.random()*opts.length)];
  const g=$('gameGrid');g.innerHTML='';
  opts.forEach(p=>{
    const c=document.createElement('div');c.className='card gcard';
    c.innerHTML=`<img src="${p.img}" alt=""><b>${p.name}</b>`;
    c.onclick=()=>{
      if(answered)return;answered=true;st++;
      const ok=p===target;if(ok)sc++;
      c.classList.add(ok?'correct':'wrong');
      if(!ok)[...g.children][opts.indexOf(target)].classList.add('correct');
      $('fb').textContent=ok?`せいかい!${target.name}でした`:`ざんねん。${target.name}でした`;
      $('sc').textContent=sc;$('st').textContent=st;$('nextBtn').classList.remove('hidden');
    };
    g.appendChild(c);
  });
  playVoice(target);
}
$('startBtn').onclick=()=>{$('setup').classList.add('hidden');$('game').classList.remove('hidden');sc=st=0;$('sc').textContent=0;$('st').textContent=0;newRound()};
$('playBtn').onclick=()=>target&&playVoice(target);
$('nextBtn').onclick=newRound;

$('setup').classList.add('hidden');$('game').classList.remove('hidden');newRound();
</script></body></html>
